<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#6c3de8"/>
<title>ZP10 Mathe – Hollenberg-Gymnasium Waldbröl</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Nunito',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
:root{--bg:#f0f2ff;--card:#fff;--card2:#eef0fb;--text:#1a1a3e;--text2:#5a5a8a;--border:#dde0f5;
  --acc:#6c3de8;--acc2:#8b5cf6;--red:#dc2626;--green:#059669;--yel:#d97706}
body.dark{--bg:#07071a;--card:#10102a;--card2:#171730;--text:#e8e8ff;--text2:#8888bb;--border:#252550}

/* FULL-WIDTH RESPONSIVE */
#app{width:100%;min-height:100vh;position:relative}
.view{padding:16px 14px 86px;animation:slideUp .3s ease}
@media(min-width:540px){.view{padding:20px 22px 86px}}
@media(min-width:800px){.view{padding:26px 40px 86px}}
@media(min-width:1100px){.view{padding:30px 80px 86px;max-width:1100px;margin:0 auto}}
@media(min-width:1400px){.view{max-width:1300px}}

.card{background:var(--card);border-radius:18px;padding:18px;
  box-shadow:0 3px 18px rgba(0,0,0,.07);border:1.5px solid var(--border)}
.btn{border:none;border-radius:13px;padding:11px 20px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:'Nunito',sans-serif;transition:all .15s;display:inline-flex;
  align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,#6c3de8,#8b5cf6);color:#fff;
  box-shadow:0 4px 14px rgba(108,61,232,.28)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(108,61,232,.38)}
.btn-g{background:transparent;color:var(--text2);border:1.5px solid var(--border);
  border-radius:13px;padding:9px 16px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:'Nunito',sans-serif;transition:all .15s}
.btn-g:hover{border-color:var(--acc);color:var(--acc)}
.btn-danger{background:#dc2626;color:#fff;border:none}
.btn-success{background:#16a34a;color:#fff;border:none}

.inp{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);
  font-size:15px;font-family:'Nunito',sans-serif;font-weight:600;outline:none;
  background:var(--card);color:var(--text);transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(108,61,232,.1)}
.inp-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:4px;display:block}

.pb{background:var(--card2);border-radius:999px;height:8px;overflow:hidden}
.pb-fill{height:100%;border-radius:999px;transition:width .8s ease}

.d-leicht{background:#dcfce7;color:#166534;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700}
.d-mittel{background:#fef3c7;color:#92400e;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700}
.d-schwer{background:#fee2e2;color:#991b1b;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700}
.xp-pill{background:rgba(108,61,232,.12);color:var(--acc);border-radius:8px;padding:2px 9px;font-size:11px;font-weight:700}
.admin-chip{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;
  border-radius:7px;padding:2px 7px;font-size:10px;font-weight:800}

/* AUTH PORTAL */
#auth-portal{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:16px;background:linear-gradient(160deg,#1a0533 0%,#2d1566 45%,#0d2b6e 100%)}
.auth-blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.28;pointer-events:none;z-index:0}
.auth-box{display:flex;width:100%;max-width:860px;border-radius:24px;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.5);position:relative;z-index:1}
.auth-left{flex:1;padding:36px;background:linear-gradient(160deg,rgba(108,61,232,.92),rgba(15,50,130,.92));
  color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.auth-right{flex:1.1;padding:36px;background:var(--card);min-width:0;overflow-y:auto;max-height:100vh}
.tab-row{display:flex;background:var(--card2);border-radius:11px;padding:3px;margin-bottom:18px;
  border:1.5px solid var(--border)}
.tab-btn{flex:1;padding:8px;border:none;border-radius:9px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:'Nunito',sans-serif;transition:all .2s;background:transparent;color:var(--text2)}
.tab-btn.active{background:var(--acc);color:#fff}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--text2);font-size:12px;font-weight:600}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.err-msg{background:#fff0f0;border:1.5px solid #fca5a5;border-radius:9px;padding:9px 12px;
  color:var(--red);font-size:13px;font-weight:600;margin-bottom:10px}
body.dark .err-msg{background:#2d0a0a;border-color:#7f1d1d}
@media(max-width:600px){.auth-left{display:none}.auth-right{padding:24px 20px;max-height:none}}

/* NAV */
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1.5px solid var(--border);display:flex;
  box-shadow:0 -4px 20px rgba(0,0,0,.08);z-index:100;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{flex:1;background:none;border:none;padding:9px 4px;cursor:pointer;
  font-family:'Nunito',sans-serif;transition:all .15s;color:var(--text2);min-width:0}
.nav-btn.active{color:var(--acc)}
.nav-dot{width:16px;height:3px;background:var(--acc);border-radius:999px;margin:2px auto 0}

/* DRAWING */
.canvas-wrap{border:1.5px solid var(--border);border-radius:14px;overflow:hidden;margin-top:8px;background:#fff}
body.dark .canvas-wrap{background:#1a1a3e}
.canvas-toolbar{display:flex;gap:6px;padding:7px 9px;background:var(--card2);flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border)}
.canvas-el{display:block;width:100%;touch-action:none;cursor:crosshair}
body.dark .canvas-el{filter:invert(1) hue-rotate(180deg)}
.tool-btn{border:1.5px solid var(--border);background:var(--card);border-radius:8px;
  padding:5px 9px;cursor:pointer;font-size:12px;font-weight:700;color:var(--text2);
  font-family:'Nunito',sans-serif;transition:all .15s}
.tool-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}

/* EXAM */
.exam-timer{border-radius:11px;padding:7px 13px;font-weight:800;font-size:16px;
  font-variant-numeric:tabular-nums;letter-spacing:.4px;white-space:nowrap}
.et-ok{background:#dcfce7;color:#166534;border:1.5px solid #22c55e}
.et-warn{background:#fef3c7;color:#92400e;border:1.5px solid #f59e0b}
.et-urgent{background:#fee2e2;color:#dc2626;border:1.5px solid #ef4444;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
.q-box{border-left:4px solid var(--acc);background:var(--card);border-radius:16px;
  padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q-box.open-type{border-left-color:#d97706}
.mc-opt{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--border);
  border-radius:13px;padding:11px 15px;cursor:pointer;font-size:14px;font-weight:600;
  color:var(--text);font-family:'Nunito',sans-serif;transition:all .2s;margin-bottom:7px;display:block}
.mc-opt:hover{border-color:var(--acc);background:var(--card2)}
.mc-opt.sel{border-color:var(--acc);background:rgba(108,61,232,.07)}
.mc-opt.correct{background:#dcfce7;border-color:#22c55e;color:#166534}
.mc-opt.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.formula-panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);
  background:var(--card);border-left:1.5px solid var(--border);z-index:8000;
  overflow-y:auto;padding:20px 16px 30px;box-shadow:-8px 0 32px rgba(0,0,0,.15);
  animation:slideRight .25s ease}
@keyframes slideRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9000;
  display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--card);border-radius:22px;padding:24px;max-width:400px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .3s ease}
.badge-alert{position:fixed;top:16px;right:16px;z-index:9999;
  background:linear-gradient(135deg,#6c3de8,#8b5cf6);color:#fff;
  border-radius:14px;padding:11px 16px;box-shadow:0 8px 30px rgba(108,61,232,.4);
  animation:pop .4s ease;display:flex;align-items:center;gap:8px;max-width:240px}
.user-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--card);margin-bottom:7px}

@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(108,61,232,.3);border-radius:3px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
'use strict';
const {useState,useEffect,useRef,useCallback,createElement:h,Fragment}=React;

/* ═══════════════════════ STORAGE HELPERS ═══════════════════════ */
const USERS_KEY='zp10_users_v5';const SESSION_KEY='zp10_sess_v5';
const EXAM_KEYS={2024:'zp10_exam2024_v4',2025:'zp10_exam2025_v1'};
const EXAM_DONE_KEYS={2024:'zp10_done2024_v4',2025:'zp10_done2025_v1'};
const P1_SEC=2400,P2_SEC=4800,TOTAL_SEC=7200; // 40+80=120 min

function loadUsers(){try{const d=localStorage.getItem(USERS_KEY);return d?JSON.parse(d):initUsers();}catch(e){return initUsers();}}
function saveUsers(u){try{localStorage.setItem(USERS_KEY,JSON.stringify(u));}catch(e){}}
function initUsers(){const u=[{id:1,username:'admin',password:btoa('Admin@ZP10!'),displayName:'Administrator',avatar:'👑',xp:0,streak:0,lastLogin:null,badges:[],progress:{},isAdmin:true,provider:'local',createdAt:new Date().toISOString()}];saveUsers(u);return u;}
function getSession(){try{return parseInt(localStorage.getItem(SESSION_KEY))||null;}catch(e){return null;}}
function setSession(id){try{id?localStorage.setItem(SESSION_KEY,String(id)):localStorage.removeItem(SESSION_KEY);}catch(e){}}
function getCurrentUser(){const id=getSession();if(!id)return null;return loadUsers().find(u=>u.id===id)||null;}
function updateUser(id,upd){const us=loadUsers();const i=us.findIndex(u=>u.id===id);if(i>=0){us[i]={...us[i],...upd};saveUsers(us);return us[i];}return null;}
function deleteUser(id){saveUsers(loadUsers().filter(u=>u.id!==id));}
function nextId(){return Math.max(0,...loadUsers().map(u=>u.id))+1;}
function saveExam(year,data){try{localStorage.setItem(EXAM_KEYS[year],JSON.stringify({...data,savedAt:Date.now()}));}catch(e){}}
function loadExam(year){try{const d=localStorage.getItem(EXAM_KEYS[year]);return d?JSON.parse(d):null;}catch(e){return null;}}
function clearExam(year){try{localStorage.removeItem(EXAM_KEYS[year]);}catch(e){}}
function canStartExam(year){try{const d=localStorage.getItem(EXAM_DONE_KEYS[year]);if(!d)return{ok:true};const t=parseInt(d);const until=t+86400000;return until<=Date.now()?{ok:true}:{ok:false,unlockAt:new Date(until)};}catch(e){return{ok:true};}}
function markExamDone(year){try{localStorage.setItem(EXAM_DONE_KEYS[year],String(Date.now()));}catch(e){}}

/* ═══════════════════════ LEARNING DATA ═══════════════════════ */
const AVATARS=["🦊","🐼","🦁","🐯","🦋","🐳","🦄","🐸","🤖","👾","🎮","⭐","🔥","💎","🚀"];
const XP_LVL=[0,100,250,500,900,1400,2100,3000,4500,6500,9000];
const LVL_NAMES=["Starter 🌱","Lernling 📚","Entdecker 🔍","Denker 💭","Kenner 🎯","Experte ⚡","Meister 🏆","Champion 🌟","Legende 🎓","Mathe-Gott 👑","Unbesiegbar 💫"];
const SUBJECTS=[
  {id:"arith",name:"Arithmetik & Algebra",emoji:"🔢",grad:"linear-gradient(135deg,#667eea,#764ba2)",col:"#7c3aed",light:"#f5f3ff",cids:["zahlen","groessen","prozent","zinsen","potenzen","wurzeln","terme","lin_gl","lgs","quad_gl","expo_gl"]},
  {id:"funk", name:"Funktionen",emoji:"📈",grad:"linear-gradient(135deg,#11998e,#38ef7d)",col:"#059669",light:"#ecfdf5",cids:["zuordnung","lin_funk","quad_funk","expo_funk","sinus"]},
  {id:"geo",  name:"Geometrie",emoji:"📐",grad:"linear-gradient(135deg,#f093fb,#f5576c)",col:"#db2777",light:"#fdf2f8",cids:["symmetrie","kongruenz","kreis","flaeche","volumen","streckung","trig"]},
  {id:"stoch",name:"Stochastik",emoji:"🎲",grad:"linear-gradient(135deg,#4facfe,#00f2fe)",col:"#0284c7",light:"#f0f9ff",cids:["statistik","zufall","baum","bedingt"]},
];
const ALL_CH=SUBJECTS.flatMap(s=>s.cids);
const BADGES=[
  {id:"first",emoji:"🌱",name:"Erster Schritt",desc:"Erste Aufgabe gelöst"},
  {id:"streak3",emoji:"🔥",name:"3-Tage-Streak",desc:"3 Tage in Folge"},
  {id:"streak7",emoji:"🏆",name:"Wochenheld",desc:"7 Tage in Folge"},
  {id:"perfect",emoji:"💎",name:"Perfektionist",desc:"100% bei einem Quiz"},
  {id:"stars5",emoji:"⭐",name:"Sternsammler",desc:"5 Kapitel mit 3★"},
  {id:"arith",emoji:"🔢",name:"Algebra-Ass",desc:"Alle Arithmetik-Kapitel"},
  {id:"funk",emoji:"📈",name:"Funktions-Profi",desc:"Alle Funktionen"},
  {id:"geo",emoji:"📐",name:"Geo-Experte",desc:"Alle Geometrie-Kapitel"},
  {id:"stoch",emoji:"🎲",name:"Statistiker",desc:"Alle Stochastik-Kapitel"},
  {id:"allDone",emoji:"🎓",name:"ZP10-Bereit",desc:"Alle 27 Kapitel"},
  {id:"lv5",emoji:"⚡",name:"Level 5",desc:"Level 5 erreicht"},
  {id:"xp1000",emoji:"💫",name:"XP-Jäger",desc:"1000 XP gesammelt"},
  {id:"exam",emoji:"🏅",name:"Prüfungs-Held",desc:"ZP10-Modus bestanden"},
  {id:"zp24",emoji:"🥇",name:"ZP10 2024",desc:"Echte ZP10 2024 bestanden"},
];
const CH={
  zahlen:{id:"zahlen",sub:"arith",name:"Zahlen ordnen",emoji:"🔢",diff:"leicht",
    theory:"• Bruch→Dezimal: Zähler÷Nenner  (3/4=0,75)\n• Dezimal→Prozent: ×100  (0,75=75%)\n• Vergleich: alles in Dezimalzahlen\n• Vorzeichen: –5 < –2 (links=kleiner)",
    qs:[{t:"mc",q:"Wie viel Prozent sind 3/4?",o:["25%","50%","75%","80%"],a:2,e:"3÷4=0,75 → ×100=75%",d:"leicht",x:10},
        {t:"tf",q:"–0,9 > –0,1, weil 9 > 1",a:false,e:"–0,9 < –0,1 (weiter links!)",d:"leicht",x:10},
        {t:"mc",q:"Welche Zahl ist am größten?",o:["3/7≈0,429","3/10=0,3","2/5=0,4","1/3≈0,333"],a:0,e:"3/7≈0,4286",d:"mittel",x:20},
        {t:"mc",q:"0,625 vollständig als Bruch:",o:["6/10","5/8","62/100","3/5"],a:1,e:"625/1000=5/8",d:"mittel",x:20},
        {t:"tf",q:"–1/4 < –1/5",a:true,e:"–0,25 < –0,2 ✓",d:"mittel",x:20}]},
  groessen:{id:"groessen",sub:"arith",name:"Größen umrechnen",emoji:"📏",diff:"leicht",
    theory:"• Längen: ×10 pro Stufe  (km→m: ×1000)\n• Flächen: ×100 pro Stufe (m²→cm²: ×10000)\n• Volumen: ×1000 pro Stufe\n• 1l=1dm³,  1ml=1cm³",
    qs:[{t:"mc",q:"35,4 km = ? dm",o:["35400","354000","3540","35400000"],a:1,e:"×10000=354000 dm",d:"leicht",x:10},
        {t:"mc",q:"0,18 km² = ? m²",o:["1800","18000","180000","1800000"],a:2,e:"×1000000=180000 m²",d:"mittel",x:20},
        {t:"tf",q:"1 m² = 10 000 cm²",a:true,e:"100×100=10000 ✓",d:"leicht",x:10},
        {t:"mc",q:"551,84054 gerundet auf Zehntel:",o:["551,8","551,9","552,0","551,84"],a:0,e:"4<5 → abrunden→551,8",d:"mittel",x:20},
        {t:"mc",q:"2,5 h = ? s",o:["150","1500","9000","15000"],a:2,e:"2,5×3600=9000 s",d:"mittel",x:20}]},
  prozent:{id:"prozent",sub:"arith",name:"Prozentrechnung",emoji:"💯",diff:"leicht",
    theory:"• W=G×p/100  • p=(W/G)×100  • G=W×100/p\n• +p%→×(1+p/100),  –p%→×(1–p/100)\n• ⚠️ +10% dann –10% ≠ 0%!",
    qs:[{t:"mc",q:"Pullover 80€, 25% Rabatt. Preis?",o:["55€","60€","65€","70€"],a:1,e:"80×0,75=60€",d:"leicht",x:10},
        {t:"mc",q:"W=36€, G=720€. p=?",o:["3%","4%","5%","6%"],a:2,e:"36/720×100=5%",d:"leicht",x:10},
        {t:"tf",q:"+10% dann –10% = Ausgangswert",a:false,e:"100×1,1×0,9=99 → –1%",d:"mittel",x:20},
        {t:"mc",q:"Nach 20% Rabatt kostet Handy 480€. Ursprungspreis?",o:["560€","580€","600€","620€"],a:2,e:"G×0,8=480→G=600€",d:"mittel",x:20},
        {t:"mc",q:"G=420kg, p=80%. W=?",o:["314kg","336kg","350kg","380kg"],a:1,e:"420×0,8=336 kg",d:"leicht",x:10}]},
  zinsen:{id:"zinsen",sub:"arith",name:"Zinsrechnung",emoji:"🏦",diff:"mittel",
    theory:"• Z=K×p/100\n• Tageszins: Z=K×p/100×t/360\n• Zinseszins: Kₙ=K₀×(1+p/100)ⁿ",
    qs:[{t:"mc",q:"K=2000€, p=3%. Jahreszinsen?",o:["40€","50€","60€","70€"],a:2,e:"2000×0,03=60€",d:"leicht",x:10},
        {t:"tf",q:"Zinseszins = exponentielles Wachstum",a:true,e:"Kₙ=K₀×(1+p/100)ⁿ ✓",d:"mittel",x:20},
        {t:"mc",q:"K₀=4000€, p=2,5%, n=6. Kₙ≈?",o:["4550€","4638€","4720€","4800€"],a:1,e:"4000×1,025⁶≈4638€",d:"schwer",x:30}]},
  potenzen:{id:"potenzen",sub:"arith",name:"Potenzen",emoji:"⚡",diff:"mittel",
    theory:"• aᵐ×aⁿ=aᵐ⁺ⁿ  • aᵐ/aⁿ=aᵐ⁻ⁿ  • (aᵐ)ⁿ=aᵐⁿ\n• a⁰=1  • a⁻ⁿ=1/aⁿ\n• Wiss. Notation: a×10ⁿ mit 1≤a<10",
    qs:[{t:"tf",q:"(–7)² = –49",a:false,e:"(–7)²=+49, nur –7²=–49",d:"leicht",x:10},
        {t:"mc",q:"2³ × 2⁴ = ?",o:["2⁷","2¹²","2¹","4⁷"],a:0,e:"3+4=7→2⁷=128",d:"mittel",x:20},
        {t:"mc",q:"a⁴ / a³ = ?",o:["a⁷","a","a¹²","1"],a:1,e:"4–3=1→a",d:"leicht",x:10},
        {t:"tf",q:"–3⁴ = (–3)⁴",a:false,e:"–81 ≠ +81",d:"schwer",x:30}]},
  wurzeln:{id:"wurzeln",sub:"arith",name:"Wurzeln",emoji:"√",diff:"mittel",
    theory:"• √(a×b)=√a×√b  • √(a/b)=√a/√b\n• ⚠️ √(a+b)≠√a+√b\n• √72=√(36×2)=6√2",
    qs:[{t:"mc",q:"√72 × √2 = ?",o:["6","9","12","18"],a:2,e:"√144=12",d:"leicht",x:10},
        {t:"tf",q:"√(a+b)=√a+√b ist immer wahr",a:false,e:"√25=5≠3+4=7",d:"leicht",x:10},

   task:'Eine Schülerfirma führt eine Tabellenkalkulation:\n\nSpalte A: Produkt | B: Stück | C: Verkaufspreis | D: Einkaufspreis | E: Gewinn/Stück | F: Gesamtgewinn\nZeile 2 (Blumen): B2=90, C2=2,00€, D2=1,40€, E2=0,60€, F2=54,00€\nZeile 3 (Schokoherzen): B3=140, C3=1,50€, D3=0,99€, E3=0,51€, F3=71,40€\n\nGib eine Formel für Zelle F2 an.',

/* ═══════════════════════ UTILS ═══════════════════════ */
const getLevel=xp=>{let l=0;for(let i=0;i<XP_LVL.length;i++){if(xp>=XP_LVL[i])l=i;else break;}return l;};
const getLvlPct=xp=>{const l=getLevel(xp);const nxt=XP_LVL[l+1]||XP_LVL[l]+1000;return((xp-XP_LVL[l])/(nxt-XP_LVL[l]))*100;};
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const checkBadges=(user,progress)=>{
  const e=new Set(user.badges||[]);const n=[];const add=id=>{if(!e.has(id)){e.add(id);n.push(id);}};
  const done=ALL_CH.filter(id=>progress[id]?.stars>0);
  if(Object.values(progress).reduce((s,p)=>s+(p.attempts||0),0)>0)add('first');
  if((user.streak||0)>=3)add('streak3');if((user.streak||0)>=7)add('streak7');
  if(Object.values(progress).some(p=>p.bestScore===100))add('perfect');
  if(done.filter(id=>progress[id]?.stars>=3).length>=5)add('stars5');
  if(getLevel(user.xp||0)>=5)add('lv5');if((user.xp||0)>=1000)add('xp1000');
  if(SUBJECTS[0].cids.every(id=>done.includes(id)))add('arith');
  if(SUBJECTS[1].cids.every(id=>done.includes(id)))add('funk');
  if(SUBJECTS[2].cids.every(id=>done.includes(id)))add('geo');
  if(SUBJECTS[3].cids.every(id=>done.includes(id)))add('stoch');
  if(ALL_CH.every(id=>done.includes(id)))add('allDone');
  return{badges:[...e],newOnes:n};
};


/* ═══════════════════════ DRAWING CANVAS ═══════════════════════ */
function DrawingCanvas({qid,storageKey}){
  const[open,setOpen]=useState(false);
  const[tool,setTool]=useState('pen');
  const[size,setSize]=useState(2);
  const cvRef=useRef(null);const ctxRef=useRef(null);
  const drawing=useRef(false);const last=useRef(null);
  const SK=(storageKey||'zp10draw')+'_'+qid;

  useEffect(()=>{
    if(!open||!cvRef.current)return;
    const cv=cvRef.current;const ctx=cv.getContext('2d');
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);
    ctxRef.current=ctx;
    try{const d=localStorage.getItem(SK);if(d){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=d;}}catch(e){}
  },[open,SK]);

  const getPos=e=>{
    const cv=cvRef.current;if(!cv)return{x:0,y:0};
    const r=cv.getBoundingClientRect();const sx=cv.width/r.width,sy=cv.height/r.height;
    const src=e.touches?e.touches[0]:e;
    return{x:(src.clientX-r.left)*sx,y:(src.clientY-r.top)*sy};
  };
  const onDown=e=>{e.preventDefault();drawing.current=true;last.current=getPos(e);};
  const onMove=e=>{
    if(!drawing.current)return;e.preventDefault();
    const ctx=ctxRef.current;if(!ctx)return;
    const p=getPos(e);
    ctx.beginPath();ctx.moveTo(last.current.x,last.current.y);ctx.lineTo(p.x,p.y);
    ctx.strokeStyle=tool==='eraser'?'#ffffff':'#1a1a3e';
    ctx.lineWidth=tool==='eraser'?28:size;
    ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
    last.current=p;
  };
  const onUp=()=>{
    if(!drawing.current)return;drawing.current=false;
    try{localStorage.setItem(SK,cvRef.current.toDataURL());}catch(e){}
  };
  const clear=()=>{
    const cv=cvRef.current;const ctx=ctxRef.current;if(!ctx||!cv)return;
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);
    try{localStorage.removeItem(SK);}catch(e){}
  };

  return h('div',{style:{marginTop:8}},
    h('button',{onClick:()=>setOpen(o=>!o),
      style:{background:'var(--card2)',border:'1.5px solid var(--border)',borderRadius:9,
        padding:'6px 12px',cursor:'pointer',fontSize:12,fontWeight:700,color:'var(--text2)',
        fontFamily:"'Nunito',sans-serif",display:'flex',alignItems:'center',gap:5}},
      '✏️ ',open?'Rechenraum schließen':'Rechenraum öffnen'
    ),
    open&&h('div',{className:'canvas-wrap'},
      h('div',{className:'canvas-toolbar'},
        h('button',{className:'tool-btn'+(tool==='pen'?' active':''),onClick:()=>setTool('pen')},'✏️ Stift'),
        h('button',{className:'tool-btn'+(tool==='eraser'?' active':''),onClick:()=>setTool('eraser')},'🧹 Radierer'),
        h('button',{className:'tool-btn',onClick:clear,style:{color:'var(--red)'}},'🗑️'),
        h('div',{style:{display:'flex',alignItems:'center',gap:5,marginLeft:'auto',fontSize:12,color:'var(--text2)'}},
          'Stärke:',
          h('input',{type:'range',min:1,max:10,value:size,onChange:e=>setSize(+e.target.value),
            style:{width:70,cursor:'pointer'}})
        )
      ),
      h('canvas',{ref:cvRef,width:1400,height:400,className:'canvas-el',
        onMouseDown:onDown,onMouseMove:onMove,onMouseUp:onUp,onMouseLeave:onUp,
        onTouchStart:onDown,onTouchMove:onMove,onTouchEnd:onUp,
        onPointerDown:e=>{if(e.pointerType==='pen'){e.target.setPointerCapture(e.pointerId);onDown(e);}},
        onPointerMove:e=>e.pointerType==='pen'&&onMove(e),
        onPointerUp:e=>e.pointerType==='pen'&&onUp(e),
      })
    )
  );
}

/* ═══════════════════════ ZP10 2024 EXAM ═══════════════════════ */
function ExamZP10({year,setView,awardXP,setUser}){
  const P1_Q = year===2025 ? P1_QUESTIONS_2025 : P1_QUESTIONS;
  const P2_Q = year===2025 ? P2_QUESTIONS_2025 : P2_QUESTIONS;
  const DRKEY='zp10_'+year+'_draw';
  const[phase,setPhase]=useState('loading');
  const[timeLeft,setTimeLeft]=useState(TOTAL_SEC);
  const[answers,setAnswers]=useState({});
  const[selfAssess,setSelfAssess]=useState({});
  const[qIdx,setQIdx]=useState(0);
  const[showFormula,setShowFormula]=useState(false);
  const[revealed,setRevealed]=useState({});
  const[cooldown,setCooldown]=useState(null);
  const timerRef=useRef(null);
  const phaseRef=useRef('loading');
  const timeRef=useRef(TOTAL_SEC);
  const answersRef=useRef({});

  // Sync refs
  useEffect(()=>{phaseRef.current=phase;},[phase]);
  useEffect(()=>{timeRef.current=timeLeft;},[timeLeft]);
  useEffect(()=>{answersRef.current=answers;},[answers]);

  useEffect(()=>{
    const s=canStartExam(year);
    if(!s.ok){setCooldown(s.unlockAt);setPhase('cooldown');return;}
    const saved=loadExam(year);
    if(saved&&(saved.phase==='part1'||saved.phase==='part2')){
      const elapsed=Math.floor((Date.now()-saved.savedAt)/1000);
      const tl=Math.max(0,saved.timeLeft-elapsed);
      setTimeLeft(tl);timeRef.current=tl;
      setAnswers(saved.answers||{});answersRef.current=saved.answers||{};
      setQIdx(saved.qIdx||0);
      setPhase(saved.phase);
    } else {
      setPhase('intro');
    }
  },[]);

  const startTimer=useCallback(()=>{
    clearInterval(timerRef.current);
    timerRef.current=setInterval(()=>{
      setTimeLeft(t=>{
        const nt=t-1;
        timeRef.current=nt;
        if(nt%20===0)saveExam(year,{phase:phaseRef.current,timeLeft:nt,answers:answersRef.current,qIdx:0});
        // Auto-transition P1→P2 after 40 min
        if(phaseRef.current==='part1'&&nt<=P2_SEC){
          clearInterval(timerRef.current);
          setPhase('transition');
        }
        if(nt<=0){clearInterval(timerRef.current);setPhase('eval');}
        return nt;
      });
    },1000);
  },[]);

  useEffect(()=>{
    if(phase==='part1'||phase==='part2'){
      startTimer();
      const onVis=()=>{
        if(document.hidden){
          clearInterval(timerRef.current);
          saveExam({phase:phaseRef.current,timeLeft:timeRef.current,answers:answersRef.current,qIdx:0});
        } else {
          const saved=loadExam();
          if(saved){
            const el=Math.floor((Date.now()-saved.savedAt)/1000);
            const tl=Math.max(0,saved.timeLeft-el);
            setTimeLeft(tl);timeRef.current=tl;
          }
          startTimer();
        }
      };
      document.addEventListener('visibilitychange',onVis);
      return()=>{clearInterval(timerRef.current);document.removeEventListener('visibilitychange',onVis);};
    }
  },[phase,startTimer]);

  const setAns=(id,v)=>{setAnswers(a=>{const n={...a,[id]:v};answersRef.current=n;return n;});};
  const reveal=(id)=>setRevealed(r=>({...r,[id]:true}));

  const finishEval=useCallback(()=>{
    clearInterval(timerRef.current);
    markExamDone();clearExam();
    setPhase('eval');
    const allQ=[...P1_QUESTIONS,...P2_QUESTIONS.flatMap(q=>q.type==='parts'?q.parts:[q])];
    let e=0,t=0;
    allQ.forEach(q=>{t+=(q.pts||2);if(q.type==='mc'&&answers[q.id]===q.answer)e+=(q.pts||2);if(q.type==='open'&&selfAssess[q.id]==='correct')e+=(q.pts||2);});
    const pct=Math.round(e/t*100);
    if(pct>=50){awardXP(300);setUser(u=>{if(!u)return u;const bd=[...(u.badges||[])];if(!bd.includes('exam'))bd.push('exam');if(!bd.includes('zp24'))bd.push('zp24');updateUser(u.id,{badges:bd});return{...u,badges:bd};});}
  },[answers,selfAssess,awardXP,setUser]);

  // === VIEWS ===
  if(phase==='loading')return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'80vh'}},
    h('div',{style:{textAlign:'center',color:'var(--text)'}},h('div',{style:{fontSize:48,marginBottom:10}},'⏳'),h('div',null,'Lädt…')));

  if(phase==='cooldown')return h('div',{className:'view'},
    h('div',{className:'card',style:{textAlign:'center',padding:36,maxWidth:460,margin:'0 auto'}},
      h('div',{style:{fontSize:64,marginBottom:14,animation:'float 3s infinite'}},'⏳'),
      h('h2',{style:{fontWeight:900,fontSize:22,marginBottom:8}},'Cooldown aktiv'),
      h('p',{style:{color:'var(--text2)',marginBottom:14}},'Du kannst die ZP10-Simulation erst wieder starten am:'),
      h('div',{style:{fontSize:18,fontWeight:800,color:'var(--acc)',marginBottom:20}},
        cooldown?.toLocaleString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})||'In 24 Stunden'),
      h('p',{style:{fontSize:13,color:'var(--text2)',marginBottom:20}},'Die Sperre schützt vor unüberlegten Wiederholungen und simuliert echte Prüfungsbedingungen.'),
      h('button',{className:'btn btn-g',onClick:()=>setView('dashboard')},'← Zurück')
    ));

  if(phase==='intro')return h('div',{className:'view'},
    h('button',{className:'btn btn-g',onClick:()=>setView('dashboard'),style:{marginBottom:18}},'← Zurück'),
    h('div',{className:'card',style:{background:'linear-gradient(135deg,#1a0533,#2d1566)',border:'none',color:'#fff',marginBottom:14,padding:26}},
      h('div',{style:{fontSize:52,marginBottom:10}},'🎓'),
      h('h2',{style:{fontWeight:900,fontSize:24,marginBottom:4}},'ZP10 Mathematik NRW 2024'),
      h('p',{style:{opacity:.85,fontSize:15}},'Gymnasium · Haupttermin A · Originalaufgaben')
    ),
    h('div',{className:'card',style:{marginBottom:14}},
      h('div',{style:{fontWeight:800,fontSize:16,marginBottom:12}},'📋 Prüfungsablauf'),
      [['⏱️','Gesamtdauer','120 Minuten (ein durchgehender Timer)'],
       ['📝','Teil 1 (40 Min.)','Ohne Hilfsmittel – Aufgaben 1–5'],
       ['📋','Teil 2 (80 Min.)','Mit Formelsammlung – Aufgaben 1–3'],

       ['🏅','Bestehen','≥ 50 % der Punkte → +300 Bonus-XP'],
       ['🔒','Wartezeit','24 Stunden bis zum nächsten Versuch'],
      ].map(([e,k,v],i)=>h('div',{key:k,style:{display:'flex',gap:10,padding:'7px 0',borderBottom:i<7?'1px solid var(--border)':'none',fontSize:14}},

      h('div',{style:{fontSize:64,marginBottom:12}},'✅'),
      h('h2',{style:{fontWeight:900,fontSize:24,marginBottom:8}},'Teil 1 abgegeben!'),

      h('div',{className:'card',style:{marginBottom:20,background:'#f0fdf4',border:'1.5px solid #bbf7d0',textAlign:'center'}},
        h('div',{style:{fontWeight:800,color:'#16a34a',marginBottom:4}},'⏱️ Verbleibende Zeit'),
        h('div',{style:{fontSize:32,fontWeight:900,color:'#16a34a'}},fmt(timeLeft)),
        h('p',{style:{color:'#15803d',fontSize:13,marginTop:4}},'Timer läuft weiter')
      ),
      h('button',{className:'btn btn-p',onClick:()=>{setPhase('part2');setQIdx(0);startTimer();},style:{width:'100%',fontSize:17,padding:'14px',borderRadius:16}},
        '📋 Teil 2 starten')));

  if(phase==='eval'){
    const allQ=[...P1_QUESTIONS,...P2_QUESTIONS.flatMap(q=>q.type==='parts'?q.parts:[q])];

  const renderSolution=(q,isEval)=>isEval&&revealed[q.id]&&h(Fragment,null,
    h('div',{style:{background:'#f0fdf4',border:'1.5px solid #bbf7d0',borderRadius:12,padding:'12px 14px',marginBottom:8,marginTop:8}},

      h('button',{className:'btn btn-success',onClick:()=>setSelfAssess(s=>({...s,[q.id]:'correct'})),style:{flex:1,borderRadius:10,padding:'9px',fontSize:13}},
        '✅ Meine Lösung war richtig'),
      h('button',{className:'btn btn-danger',onClick:()=>setSelfAssess(s=>({...s,[q.id]:'wrong'})),style:{flex:1,borderRadius:10,padding:'9px',fontSize:13}},
        '❌ Meine Lösung war falsch')
    ),
    q.type==='open'&&selfAssess[q.id]&&h('div',{style:{borderRadius:10,padding:'8px 12px',fontSize:13,fontWeight:700,
      background:selfAssess[q.id]==='correct'?'#f0fdf4':'#fff1f2',

      selfAssess[q.id]==='correct'?'✅ Als richtig gewertet':'❌ Als falsch gewertet')

  const renderQ=(q,isEval=false)=>{
    if(q.type==='parts'){
      return h('div',null,
        h('div',{className:'card',style:{background:'var(--card2)',marginBottom:12,padding:16}},
          h('div',{style:{fontWeight:800,fontSize:16,color:'var(--acc)',marginBottom:8}},q.nr+' – '+q.title),
          q.context&&h('pre',{style:{fontSize:13,whiteSpace:'pre-wrap',lineHeight:1.7,color:'var(--text2)',fontFamily:"'Nunito',sans-serif",margin:0}},q.context)
        ),
        q.parts.map(p=>h('div',{key:p.id,className:'q-box'+(p.type==='open'?' open-type':''),style:{marginBottom:12}},
          h('div',{style:{display:'flex',gap:8,alignItems:'center',marginBottom:8,flexWrap:'wrap'}},
            h('span',{style:{fontWeight:900,fontSize:15,color:'var(--acc)'}},'Teil '+p.sub),
            p.pts&&h('span',{style:{background:'var(--card2)',border:'1px solid var(--border)',borderRadius:6,padding:'2px 7px',fontSize:11,fontWeight:700,color:'var(--text2)'}},p.pts+' P.'),
            p.type==='open'&&h('span',{style:{background:'#fef3c7',color:'#92400e',borderRadius:6,padding:'2px 7px',fontSize:11,fontWeight:700}},'Selbstkorrektur')
          ),
          h('p',{style:{fontSize:14,fontWeight:600,marginBottom:10,lineHeight:1.6}},p.task),
          p.type==='mc'&&renderMcOpts(p),
          isEval&&!revealed[p.id]&&h('button',{onClick:()=>reveal(p.id),
            style:{background:'none',border:'1px dashed var(--border)',borderRadius:8,padding:'5px 12px',
              cursor:'pointer',fontSize:12,color:'var(--text2)',fontFamily:"'Nunito',sans-serif",marginTop:4}},
            '👁 Musterlösung anzeigen'),
          renderSolution(p,isEval),
          h(DrawingCanvas,{qid:p.id,storageKey:DRKEY})
        ))
      );
    }

    return h('div',{className:'q-box'+(q.type==='open'?' open-type':'')},
      h('div',{style:{display:'flex',gap:8,alignItems:'center',marginBottom:10,flexWrap:'wrap'}},
        h('span',{style:{fontWeight:900,fontSize:15,color:'var(--acc)'}},'Aufgabe '+q.nr),
        q.pts&&h('span',{style:{background:'var(--card2)',border:'1px solid var(--border)',borderRadius:6,padding:'2px 7px',fontSize:11,fontWeight:700,color:'var(--text2)'}},q.pts+' P.'),
        q.type==='open'&&h('span',{style:{background:'#fef3c7',color:'#92400e',borderRadius:6,padding:'2px 7px',fontSize:11,fontWeight:700}},'Selbstkorrektur')
      ),
      h('div',{style:{fontWeight:800,fontSize:15,marginBottom:6}},q.title),
      h('pre',{style:{fontSize:14,whiteSpace:'pre-wrap',lineHeight:1.7,fontFamily:"'Nunito',sans-serif",marginBottom:12,color:'var(--text)'}},q.task),
      q.type==='mc'&&renderMcOpts(q),
      isEval&&!revealed[q.id]&&h('button',{onClick:()=>reveal(q.id),
        style:{background:'none',border:'1px dashed var(--border)',borderRadius:8,padding:'5px 12px',
          cursor:'pointer',fontSize:12,color:'var(--text2)',fontFamily:"'Nunito',sans-serif",marginTop:4}},
        '👁 Musterlösung anzeigen'),
      renderSolution(q,isEval),

  };

  return h('div',{style:{padding:'14px 14px 90px'}},
    // Header bar
    h('div',{style:{position:'sticky',top:0,background:'var(--bg)',zIndex:50,paddingBottom:8,paddingTop:4,
      display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',borderBottom:'1px solid var(--border)',marginBottom:14,paddingBottom:10}},
      h('span',{className:'exam-timer '+tcls},'⏱️ '+fmt(timerVal)),
      h('div',{style:{flex:1,minWidth:80}},
        h('div',{style:{fontSize:10,color:'var(--text2)',marginBottom:2}},
          phase==='part1'?'Teil 1 – Ohne Hilfsmittel':'Teil 2 – Mit Formelsammlung'),
        h('div',{className:'pb',style:{height:6}},
          h('div',{className:'pb-fill',style:{
            background:phase==='part1'?'linear-gradient(90deg,#6c3de8,#8b5cf6)':'linear-gradient(90deg,#059669,#38ef7d)',
            width:((qIdx+1)/questions.length*100)+'%'}}))
      ),
      h('div',{style:{fontSize:12,fontWeight:700,color:'var(--text2)'}},(qIdx+1)+'/'+questions.length),
      phase==='part2'&&h('button',{onClick:()=>setShowFormula(s=>!s),
        style:{background:showFormula?'var(--acc)':'var(--card)',color:showFormula?'#fff':'var(--acc)',
          border:'1.5px solid var(--acc)',borderRadius:9,padding:'6px 11px',cursor:'pointer',
          fontSize:13,fontWeight:700,fontFamily:"'Nunito',sans-serif"}},
        '📋 Formelsammlung')
    ),

    showFormula&&h(FormulaSheet,{onClose:()=>setShowFormula(false)}),

    // Question
    renderQ(curQ),

    // Navigation
    h('div',{style:{display:'flex',gap:9,marginTop:16,flexWrap:'wrap',alignItems:'center'}},
      qIdx>0&&h('button',{className:'btn btn-g',onClick:()=>setQIdx(i=>i-1)},'← Zurück'),
      h('div',{style:{flex:1}}),
      !isLast&&h('button',{className:'btn btn-p',onClick:()=>setQIdx(i=>i+1)},'Weiter →'),
      isLast&&phase==='part1'&&h('button',{className:'btn btn-p',
        style:{background:'linear-gradient(135deg,#059669,#38ef7d)'},
        onClick:()=>{clearInterval(timerRef.current);setPhase('transition');}},
        '✅ Teil 1 abgeben'),
      isLast&&phase==='part2'&&h('button',{className:'btn btn-p',
        style:{background:'linear-gradient(135deg,#f093fb,#f5576c)'},
        onClick:finishEval},
        '🎓 Prüfung abgeben & auswerten')
    )
  );
}

/* ═══════════════════════ AUTH PORTAL ═══════════════════════ */
function AuthPortal({onLogin}){
  const[tab,setTab]=useState('login');
  const[uname,setUname]=useState('');const[pwd,setPwd]=useState('');
  const[name,setName]=useState('');const[cpwd,setCpwd]=useState('');
  const[avatar,setAvatar]=useState('🦊');
  const[show,setShow]=useState(false);const[err,setErr]=useState('');

  const doLogin=()=>{
    setErr('');if(!uname.trim()||!pwd){setErr('Bitte alle Felder ausfüllen.');return;}
    const users=loadUsers();
    const user=users.find(u=>u.username.toLowerCase()===uname.trim().toLowerCase()&&u.provider==='local');
    if(!user){setErr('Benutzername nicht gefunden.');return;}
    if(user.password!==btoa(pwd)){setErr('Falsches Passwort.');return;}
    const today=new Date().toDateString(),yest=new Date(Date.now()-86400000).toDateString();
    const ns=user.lastLogin===yest?(user.streak||0)+1:user.lastLogin===today?(user.streak||0):1;
    const upd=updateUser(user.id,{lastLogin:today,streak:ns});
    setSession(user.id);onLogin(upd);
  };

  const doRegister=()=>{
    setErr('');if(!uname.trim()||!pwd||!name.trim()){setErr('Pflichtfelder ausfüllen.');return;}
    if(pwd.length<6){setErr('Passwort mind. 6 Zeichen.');return;}
    if(pwd!==cpwd){setErr('Passwörter stimmen nicht überein.');return;}
    const users=loadUsers();
    if(users.find(u=>u.username.toLowerCase()===uname.trim().toLowerCase())){setErr('Benutzername vergeben.');return;}
    const nu={id:nextId(),username:uname.trim(),password:btoa(pwd),displayName:name.trim(),avatar,xp:0,streak:1,
      lastLogin:new Date().toDateString(),badges:[],progress:{},isAdmin:false,provider:'local',createdAt:new Date().toISOString()};
    users.push(nu);saveUsers(users);setSession(nu.id);onLogin(nu);
  };

  return h('div',{id:'auth-portal'},
    h('div',{className:'auth-blob',style:{width:380,height:380,background:'#6c3de8',top:-80,left:-80}}),
    h('div',{className:'auth-blob',style:{width:280,height:280,background:'#3b82f6',bottom:60,right:-40}}),
    h('div',{className:'auth-box'},
      // Left panel
      h('div',{className:'auth-left'},
        h('div',null,
          h('div',{style:{fontSize:26,fontWeight:900,marginBottom:4}},'🧮 ZP10 Mathe'),
          h('div',{style:{opacity:.8,fontSize:13}},'Hollenberg-Gymnasium Waldbröl')
        ),
        h('div',null,
          ['📚 27 Kapitel aus dem offiziellen Lernskript',
           '🎓 Echte ZP10 2024 Prüfungsaufgaben (GYM NRW)',
           '✏️ Rechenraum mit Stift, Maus & Touch',
           '⏱️ Echter 120-Min-Timer mit Autosave',
           '📊 XP-System, Level & Abzeichen',
          ].map((f,i)=>h('div',{key:i,style:{display:'flex',gap:9,padding:'8px 12px',
            background:'rgba(255,255,255,.1)',borderRadius:11,marginBottom:6,fontSize:13,alignItems:'center'}},
            h('span',null,f.split(' ')[0]),h('span',null,f.split(' ').slice(1).join(' '))))
        ),
        h('div',{style:{fontSize:11,opacity:.45}},'Copyright © Maximilian Gölitzer 2026')
      ),
      // Right panel
      h('div',{className:'auth-right'},
        h('h2',{style:{fontWeight:900,fontSize:21,marginBottom:3}},tab==='login'?'Willkommen zurück 👋':'Account erstellen 🎉'),
        h('p',{style:{color:'var(--text2)',fontSize:13,marginBottom:16}},tab==='login'?'Melde dich an.':'Starte kostenlos.'),
        h('div',{className:'tab-row'},
          h('button',{className:'tab-btn'+(tab==='login'?' active':''),onClick:()=>{setTab('login');setErr('');}},
            'Anmelden'),
          h('button',{className:'tab-btn'+(tab==='register'?' active':''),onClick:()=>{setTab('register');setErr('');}},
            'Registrieren')
        ),
        err&&h('div',{className:'err-msg'},'⚠️ '+err),
        h('label',{className:'inp-label'},'Benutzername'),
        h('input',{className:'inp',value:uname,onChange:e=>setUname(e.target.value),
          placeholder:'z.B. max.mustermann',style:{marginBottom:10},
          onKeyDown:e=>e.key==='Enter'&&tab==='login'&&doLogin()}),
        tab==='register'&&h(Fragment,null,
          h('label',{className:'inp-label'},'Anzeigename'),
          h('input',{className:'inp',value:name,onChange:e=>setName(e.target.value),
            placeholder:'Dein vollständiger Name',style:{marginBottom:10}})
        ),
        h('div',{style:{position:'relative',marginBottom:10}},
          h('label',{className:'inp-label'},'Passwort'),
          h('input',{className:'inp',type:show?'text':'password',value:pwd,onChange:e=>setPwd(e.target.value),
            placeholder:tab==='register'?'Mind. 6 Zeichen':'••••••••',style:{paddingRight:44},
            onKeyDown:e=>e.key==='Enter'&&tab==='login'&&doLogin()}),
          h('span',{onClick:()=>setShow(s=>!s),style:{position:'absolute',right:12,top:30,cursor:'pointer',fontSize:16}},show?'🙈':'👁️')
        ),
        tab==='register'&&h(Fragment,null,
          h('label',{className:'inp-label'},'Passwort bestätigen'),
          h('input',{className:'inp',type:'password',value:cpwd,onChange:e=>setCpwd(e.target.value),
            placeholder:'Passwort wiederholen',style:{marginBottom:10}}),
          h('div',{style:{marginBottom:12}},
            h('label',{className:'inp-label',style:{marginBottom:6}},'Avatar wählen'),
            h('div',{style:{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:5}},
              AVATARS.map(a=>h('button',{key:a,onClick:()=>setAvatar(a),
                style:{fontSize:22,background:avatar===a?'linear-gradient(135deg,#6c3de8,#8b5cf6)':'var(--card2)',
                  border:'2px solid',borderColor:avatar===a?'#6c3de8':'transparent',
                  borderRadius:11,padding:'7px 3px',cursor:'pointer',
                  transform:avatar===a?'scale(1.08)':'scale(1)',transition:'all .15s'}},a))
            )
          )
        ),
        h('button',{className:'btn btn-p',onClick:tab==='login'?doLogin:doRegister,
          style:{width:'100%',fontSize:16,padding:'13px',borderRadius:14,marginBottom:12}},
          tab==='login'?'Anmelden →':'Account erstellen →')
      )
    )
  );
}

          h('button',{title:'Nutzer löschen',onClick:()=>setConf(u.id),

  const q=quiz.questions[quiz.current];const ch=CH[quiz.chId];const sub=SUBJECTS.find(s=>s.id===ch?.sub);
  const total=quiz.questions.length;const pct=Math.round((quiz.current/total)*100);

  const next=()=>{
    const isOk=sel===q.a;const nScore=quiz.score+(isOk?1:0);const nXp=quiz.xpGained+(isOk?q.x:0);
    const nAns=[...quiz.answers,{correct:isOk,chosen:sel,q}];
    if(quiz.current>=total-1){
      const sp=Math.round((nScore/total)*100);const stars=sp>=90?3:sp>=60?2:sp>=40?1:0;
      const prev=progress[quiz.chId];
      const np={stars:Math.max(stars,prev?.stars||0),completed:true,attempts:(prev?.attempts||0)+1,bestScore:Math.max(sp,prev?.bestScore||0)};
      const upd={...progress,[quiz.chId]:np};setProgress(upd);awardXP(nXp,upd);

    } else {setQuiz(p=>({...p,current:p.current+1,score:nScore,xpGained:nXp,answers:nAns}));setSel(null);setAnswered(false);setCorrect(false);}

/* ═══════════════════════ APP ROOT ═══════════════════════ */
function App(){
  const[view,setView]=useState('dashboard');
  const[dark,setDark]=useState(()=>{try{return localStorage.getItem('zp10_dark')==='1';}catch(e){return false;}});
  const[appUser,setAppUser]=useState(null);
  const[progress,setProgress]=useState({});
  const[curSub,setCurSub]=useState(null);
  const[curCh,setCurCh]=useState(null);
  const[quiz,setQuiz]=useState(null);
  const[quizResult,setQuizResult]=useState(null);
  const[badgeAlert,setBadgeAlert]=useState([]);
  const[loaded,setLoaded]=useState(false);

  useEffect(()=>{
    loadUsers();
    const u=getCurrentUser();
    if(u){setAppUser(u);setProgress(u.progress||{});}
    setLoaded(true);
  },[]);

  useEffect(()=>{
    if(dark){
      document.documentElement.classList.add('dark');
      document.body.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
      document.body.classList.remove('dark');
    }
    try{localStorage.setItem('zp10_dark',dark?'1':'0');}catch(e){}
  },[dark]);

  useEffect(()=>{
    if(appUser&&loaded)updateUser(appUser.id,{progress,xp:appUser.xp,badges:appUser.badges,streak:appUser.streak});
  },[progress,appUser?.xp,appUser?.badges]);

  const handleLogin=u=>{setAppUser(u);setProgress(u.progress||{});setView('dashboard');};
  const handleLogout=()=>{setSession(null);setAppUser(null);setProgress({});setView('dashboard');};

  const awardXP=useCallback((amount,prog)=>{
    setAppUser(u=>{
      if(!u)return u;
      const newXp=(u.xp||0)+amount;
      const{badges,newOnes}=checkBadges({...u,xp:newXp},prog||progress);
      if(newOnes.length)setBadgeAlert(p=>[...p,...newOnes]);
      const upd={...u,xp:newXp,badges};
      updateUser(u.id,{xp:newXp,badges});return upd;
    });
  },[progress]);

  if(!loaded)return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',
    height:'100vh',background:'linear-gradient(160deg,#1a0533,#0d2b6e)',color:'#fff',flexDirection:'column',gap:12,fontFamily:"'Nunito',sans-serif"}},
    h('div',{style:{fontSize:50,animation:'pulse 1.5s infinite'}},'🧮'),
    h('div',{style:{fontSize:17,fontWeight:800}},'ZP10 Mathe lädt…')
  );

  if(!appUser)return h(AuthPortal,{onLogin:handleLogin});

  const showNav=['dashboard','subjects','stats','badges','exam','admin'].includes(view);

  return h(Fragment,null,
    badgeAlert.map((bid,i)=>{
      const b=BADGES.find(x=>x.id===bid);if(!b)return null;
      return h('div',{key:bid,className:'badge-alert',style:{top:14+i*80}},
        h('span',{style:{fontSize:24}},b.emoji),
        h('div',null,h('div',{style:{fontWeight:800,fontSize:13}},'Neues Abzeichen!'),h('div',{style:{fontSize:12,opacity:.9}},b.name)),
        h('button',{onClick:()=>setBadgeAlert(p=>p.filter(x=>x!==bid)),
          style:{background:'rgba(255,255,255,.2)',border:'none',borderRadius:6,color:'#fff',cursor:'pointer',padding:'3px 7px',fontSize:11,marginLeft:6}},'✕')
      );
    }),
    view==='dashboard'&&h(DashView,{dark,setDark,user:appUser,progress,setView,setCurSub,onLogout:handleLogout}),
    view==='subjects'&&h(SubjectsView,{progress,setView,curSub,setCurSub,setCurCh}),
    view==='theory'&&curCh&&h(TheoryView,{ch:CH[curCh],setView,setQuiz,progress}),
    view==='quiz'&&quiz&&h(QuizView,{quiz,setQuiz,setView,setQuizResult,setProgress,awardXP,progress}),
    view==='result'&&quizResult&&h(ResultView,{result:quizResult,ch:CH[quizResult.chId],setView}),
    view==='stats'&&h(StatsView,{user:appUser,progress}),
    view==='badges'&&h(BadgesView,{user:appUser}),
    view==='exam'&&h(ExamZP10,{setView,awardXP,setUser:setAppUser}),
    view==='admin'&&appUser.isAdmin&&h(AdminPanel,{currentUser:appUser}),
    showNav&&h(NavBar,{view,setView,isAdmin:appUser.isAdmin})
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(h(App,null));
</script>
</body>
</html>
